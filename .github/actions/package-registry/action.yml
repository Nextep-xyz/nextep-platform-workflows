name: package-registry
description: Steps of lego-aws-package-publish that talk to CodeArtifact with the assumed role - token and endpoint, precheck of the version, and verification. Never publishes.
inputs:
  command:
    description: token, precheck or verify.
    required: true
  inputs-json:
    description: toJSON(inputs) of the calling workflow (it has no secret inputs).
    required: true
outputs:
  token:
    description: CodeArtifact authorization token (command token only). Masked before it is written. Pass it only to the env of the publish step.
    value: ${{ steps.run.outputs.token }}
  endpoint:
    description: npm endpoint of the repository (command token only).
    value: ${{ steps.run.outputs.endpoint }}
runs:
  using: composite
  steps:
    - name: Run the registry step
      id: run
      shell: bash
      env:
        SCRIPTS: ${{ github.action_path }}/../../../scripts
        COMMAND: ${{ inputs.command }}
        INPUTS_JSON: ${{ inputs.inputs-json }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        case "$COMMAND" in token | precheck | verify) ;; *) echo "::error::package-registry: unknown command '$COMMAND'" >&2; exit 1 ;; esac
        "$SCRIPTS/package-publish.sh" "$COMMAND"

name: setup-project
description: Package manager + Node setup, dependency cache and immutable install; optional Python toolchain with pinned requirements; optional OIDC login to CodeArtifact for private packages.
inputs:
  package-manager:
    description: npm or pnpm.
    required: false
    default: pnpm
  pnpm-version:
    description: pnpm version. Empty means the `packageManager` field of package.json.
    required: false
    default: ""
  node-version:
    description: Node version (ignored when node-version-file is set).
    required: false
    default: "22"
  node-version-file:
    description: File with the Node version (for example .nvmrc).
    required: false
    default: ""
  install-dirs:
    description: Comma separated package roots (relative paths). Each one needs its own lockfile.
    required: false
    default: "."
  python-version:
    description: Python version (3.N or 3.N.P). Empty means no Python is installed. Needs python-requirements.
    required: false
    default: ""
  python-requirements:
    description: Comma separated requirements files (relative paths), installed in order. Every requirement must be pinned with == (or carry hashes).
    required: false
    default: ""
  # Optional login to CodeArtifact (SPEC.md section 0, "Enmienda Login del registry"). All empty = no role is assumed and the install is what it always was.
  registry-role-arn:
    description: READ-ONLY registry role to assume through OIDC (from a repository variable, never a literal). Empty disables the login. The calling job needs id-token write.
    required: false
    default: ""
  codeartifact-domain:
    description: CodeArtifact domain. Needed with registry-role-arn.
    required: false
    default: ""
  codeartifact-domain-owner:
    description: Account id that owns the CodeArtifact domain. Needed with registry-role-arn.
    required: false
    default: ""
  codeartifact-repository:
    description: CodeArtifact repository the private packages are installed from. Needed with registry-role-arn.
    required: false
    default: ""
  registry-scope:
    description: npm scope served by that repository, for example @example. Needed with registry-role-arn.
    required: false
    default: ""
  aws-region:
    description: AWS region of the CodeArtifact domain. Needed with registry-role-arn.
    required: false
    default: ""
runs:
  using: composite
  steps:
    # parity: P-CI-01, P-EN-02, H-02, H-16, H-17
    - name: Set up pnpm
      if: inputs.package-manager == 'pnpm'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false
    - name: Resolve the lockfiles of the package roots
      id: roots
      shell: bash
      env:
        SCRIPTS: ${{ github.action_path }}/../../../scripts
        INSTALL_DIRS: ${{ inputs.install-dirs }}
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        set -euo pipefail
        delimiter="EOF_$(openssl rand -hex 8)"
        {
          echo "lockfiles<<${delimiter}"
          "$SCRIPTS/install-dirs.sh" lockfiles
          echo "${delimiter}"
        } >>"$GITHUB_OUTPUT"
    - name: Set up Node with dependency cache
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
        node-version-file: ${{ inputs.node-version-file }}
        cache: ${{ inputs.package-manager }}
        cache-dependency-path: ${{ steps.roots.outputs.lockfiles }}
    # The login is INLINE on purpose (gate G11: a composite does not call another one). The role is read-only; the token is masked and
    # leaves this step only as an output, which the install step below (and no other) reads.
    - name: Get the registry token
      id: registry
      if: inputs.registry-role-arn != ''
      shell: bash
      env:
        SCRIPTS: ${{ github.action_path }}/../../../scripts
        INPUT_REGISTRY_ROLE_ARN: ${{ inputs.registry-role-arn }}
        INPUT_CODEARTIFACT_DOMAIN: ${{ inputs.codeartifact-domain }}
        INPUT_CODEARTIFACT_DOMAIN_OWNER: ${{ inputs.codeartifact-domain-owner }}
        INPUT_CODEARTIFACT_REPOSITORY: ${{ inputs.codeartifact-repository }}
        INPUT_REGISTRY_SCOPE: ${{ inputs.registry-scope }}
        INPUT_AWS_REGION: ${{ inputs.aws-region }}
      run: |
        set -euo pipefail
        "$SCRIPTS/registry-login.sh" token
    - name: Immutable install
      shell: bash
      env:
        SCRIPTS: ${{ github.action_path }}/../../../scripts
        INSTALL_DIRS: ${{ inputs.install-dirs }}
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        # Empty when the login is off. The ONLY place the token reaches an environment (gate GR15); install-dirs.sh turns it into an
        # ephemeral user config that holds a reference to this variable, never the value.
        CODEARTIFACT_AUTH_TOKEN: ${{ steps.registry.outputs.token }}
        REGISTRY_ENDPOINT: ${{ steps.registry.outputs.endpoint }}
        REGISTRY_SCOPE: ${{ inputs.registry-scope }}
      run: |
        set -euo pipefail
        "$SCRIPTS/install-dirs.sh" install
    # Python is optional and additive: Node is always installed (a repo with a CDK app needs it whatever its application is).
    - name: Resolve the Python requirements files (cache key)
      id: pyfiles
      if: ${{ inputs.python-version != '' }}
      shell: bash
      env:
        PYTHON_REQUIREMENTS: ${{ inputs.python-requirements }}
      run: |
        set -euo pipefail
        delimiter="EOF_$(openssl rand -hex 8)"
        {
          echo "files<<${delimiter}"
          tr ',' '\n' <<<"$PYTHON_REQUIREMENTS"
          echo "${delimiter}"
        } >>"$GITHUB_OUTPUT"
    - name: Set up Python with the pip cache
      if: ${{ inputs.python-version != '' }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ steps.pyfiles.outputs.files }}
    - name: Install the pinned Python requirements
      if: ${{ inputs.python-version != '' }}
      shell: bash
      env:
        SCRIPTS: ${{ github.action_path }}/../../../scripts
        PYTHON_REQUIREMENTS: ${{ inputs.python-requirements }}
      run: |
        set -euo pipefail
        "$SCRIPTS/python-install.sh"

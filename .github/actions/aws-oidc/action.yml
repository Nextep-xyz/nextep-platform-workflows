name: aws-oidc
description: Assume the AWS role of the environment through GitHub OIDC (no static credentials). The caller job needs `id-token`.
inputs:
  role-arn:
    description: Role to assume. Comes from `vars` of the caller repository, never a literal.
    required: true
  aws-region:
    description: AWS region.
    required: true
runs:
  using: composite
  steps:
    # parity: P-CI-06
    - name: Assume the role through OIDC
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

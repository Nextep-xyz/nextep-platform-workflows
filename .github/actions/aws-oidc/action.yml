name: aws-oidc
description: Assume the AWS role of the environment through GitHub OIDC (no static credentials). The caller job needs `id-token`.
inputs:
  role-arn:
    description: Role to assume. Comes from `vars` of the caller repository, never a literal.
    required: true
  aws-region:
    description: AWS region.
    required: true
outputs:
  account-id:
    description: >
      Account id of the assumed role (from sts get-caller-identity). Pass it to the composites that run the IaC command
      (input aws-account-id); it is never an input of the reusable workflows and never written to the runner env file.
    value: ${{ steps.account.outputs.account-id }}
runs:
  using: composite
  steps:
    # parity: P-CI-06
    - name: Assume the role through OIDC
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
    # parity: H-07
    - name: Read the account id of the assumed role
      id: account
      shell: bash
      env:
        SCRIPTS: ${{ github.action_path }}/../../../scripts
        AWS_REGION: ${{ inputs.aws-region }}
      run: |
        set -euo pipefail
        "$SCRIPTS/caller-account.sh" >>"$GITHUB_OUTPUT"

name: package-publish
description: Runs npm publish against CodeArtifact. The only step that holds the registry token, and only in its own environment; the package scripts are disabled.
inputs:
  auth-token:
    description: CodeArtifact authorization token from the token step of package-registry. Never a static token.
    required: true
  endpoint:
    description: npm endpoint of the repository.
    required: true
  inputs-json:
    description: toJSON(inputs) of the calling workflow (it has no secret inputs).
    required: true
runs:
  using: composite
  steps:
    - name: Publish the package
      shell: bash
      env:
        SCRIPTS: ${{ github.action_path }}/../../../scripts
        INPUTS_JSON: ${{ inputs.inputs-json }}
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        CODEARTIFACT_AUTH_TOKEN: ${{ inputs.auth-token }}
        CODEARTIFACT_ENDPOINT: ${{ inputs.endpoint }}
      run: |
        set -euo pipefail
        "$SCRIPTS/package-publish.sh" publish

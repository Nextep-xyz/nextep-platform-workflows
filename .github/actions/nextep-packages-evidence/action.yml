name: nextep-packages-evidence
description: Writes to the step summary a table of the @nextep/* packages of the repository (found on disk, resolved in their lockfile) and the REAL outcome of the validation steps. Honest by construction - it reads steps.<id>.outcome and never prints a fixed "all OK". No network, no secret, no permission. It never fails the job.
inputs:
  install-dirs:
    description: Comma separated package roots (the same value the install used).
    required: false
    default: "."
  package-manager:
    description: npm or pnpm.
    required: false
    default: pnpm
  root-kinds:
    description: "The kind of each root, as a JSON object {\"<root>\": \"<kind>\"} (already validated by the workflow). Empty keeps the evidence of what the repository declares. Never a secret: it is a map of paths to kinds."
    required: false
    default: ""
  environment:
    description: "The environment of the run (dev, stg or prod). It only decides how the block names its mode (enforce or warn, from scripts/lib/enforcement.sh) and whether a red policy axis is shown as a blocker or as a warning; it never changes what is read. Empty keeps the block as it was (no Mode row)."
    required: false
    default: ""
  validations:
    description: "One `<label>=<result>` per line, where the result is `steps.<id>.outcome` of a validation step, or `steps.<id>.outputs.result` of the package-guardrails step (pass, fail, warn, missing or skipped). A fixed value defeats the purpose (gate PE-OUTCOME)."
    required: true
runs:
  using: composite
  # The calling step carries `if: always()` (gate PE-ALWAYS) and so does the step below: the evidence must also be written when the validation failed.
  steps:
    - name: Write the packages evidence to the summary
      if: always()
      shell: bash
      env:
        SCRIPTS: ${{ github.action_path }}/../../../scripts
        INSTALL_DIRS: ${{ inputs.install-dirs }}
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
        ROOT_KINDS: ${{ inputs.root-kinds }}
        ENVIRONMENT: ${{ inputs.environment }}
        VALIDATIONS: ${{ inputs.validations }}
        # The platform code that runs this step (its own action context, not the OIDC claim job_workflow_ref, which the github context lacks).
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        "$SCRIPTS/packages-evidence.sh" run

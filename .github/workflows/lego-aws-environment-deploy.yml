# Reusable workflow: full environment deploy. Gate (inputs, branch guard, OIDC-stack guard) -> infra deploy ->
# database migration (+ verification + seed). Manual only (workflow_dispatch): the gate refuses any other event.
# Contract: contracts/lego-aws-environment-deploy.contract.yml (gate G12). The caller grants:
# permissions: { id-token: write, contents: read, pull-requests: write }.
# Rollback: pass image-tag (compute ecs). Nothing is built and the database is NOT migrated.
name: lego-aws-environment-deploy

on:
  workflow_call:
    inputs:
      project:
        description: "Project prefix (^[a-z][a-z0-9-]{1,15}$). Used in templates, concurrency and reports."
        type: string
        required: true
      environment:
        description: "Logical environment: dev, stg or prod. It is NOT a GitHub Environment."
        type: string
        required: true
      compute:
        description: "lambda or ecs."
        type: string
        required: true
      aws-region:
        description: "AWS region."
        type: string
        default: "us-east-2"
      role-arn:
        description: "Role to assume through OIDC. Pass it from a repository variable, never a literal."
        type: string
        required: true
      package-manager:
        description: "npm or pnpm."
        type: string
        default: "pnpm"
      pnpm-version:
        description: "pnpm version. Empty means the packageManager field of package.json."
        type: string
        default: ""
      node-version:
        description: "Node version (ignored when node-version-file is set)."
        type: string
        default: "22"
      node-version-file:
        description: "File with the Node version, for example .nvmrc."
        type: string
        default: ""
      branch-map:
        description: "JSON object branch -> environment. Guard against deploying a branch to the wrong environment."
        type: string
        default: ""
      bastion-id-ssm-param:
        description: "Template of the SSM parameter with the bastion instance id. Setting it enables the migration."
        type: string
        default: ""
      db-endpoint-ssm-param:
        description: "Template of the SSM parameter with the database endpoint."
        type: string
        default: ""
      db-secret-id:
        description: "Template of the secret id with the keys username and password."
        type: string
        default: ""
      db-name:
        description: "Database name."
        type: string
        default: ""
      db-schema:
        description: "Database schema."
        type: string
        default: ""
      db-port:
        description: "Database port, also the local port of the tunnel."
        type: number
        default: 5432
      db-ssl-mode:
        description: "verify-full or require. Nothing weaker is accepted."
        type: string
        default: "verify-full"
      db-url-template:
        description: "Template of the database connection URL given to the migration commands. Placeholders: user, password (URL-encoded), host, port, db, schema, sslmode."
        type: string
        default: "postgresql://{user}:{password}@{host}:{port}/{db}?schema={schema}&sslmode={sslmode}"
      migration-pre-command:
        description: "Generic hook that runs inside the tunnel before the migration (debt, see the roadmap)."
        type: string
        default: ""
      migration-command:
        description: "Command that applies the migrations."
        type: string
        default: "make migrate"
      migration-verify-command:
        description: "Command that exits non-zero when the database is not aligned."
        type: string
        default: "make migrate-status"
      post-migrate-command:
        description: "Idempotent seed command."
        type: string
        default: ""
      migration-timeout-minutes:
        description: "Timeout of each database command, in minutes."
        type: number
        default: 20
      image-tag:
        description: "Empty builds a new image. Non-empty is a ROLLBACK: nothing is built or migrated, the image must exist."
        type: string
        default: ""
      prepare-command:
        description: "Generates the ORM client / artifacts before the infra deploy."
        type: string
        default: ""
      prepare-check-command:
        description: "Guard run after prepare-command; the job fails when it exits non-zero."
        type: string
        default: ""
      clean-command:
        description: "Purges the synth cache to force a clean bundle."
        type: string
        default: ""
      infra-bootstrap-command:
        description: "Deploys the image repository stack before building (compute ecs)."
        type: string
        default: ""
      infra-deploy-command:
        description: "Deploys the infrastructure. It must never deploy the OIDC role stack."
        type: string
        required: true
      pin-image-tag-environments:
        description: "Comma separated environments where the deployed image tag is pinned (IMAGE_TAG)."
        type: string
        default: "stg,prod"
      ecr-repository:
        description: "Template of the ECR repository name."
        type: string
        default: ""
      dockerfile:
        description: "Dockerfile path."
        type: string
        default: "Dockerfile"
      docker-context:
        description: "Docker build context."
        type: string
        default: "."
      docker-target:
        description: "Docker build target (empty means the last stage)."
        type: string
        default: ""
      # DORA-PLACEHOLDER:BEGIN  (inactive until the collector endpoint exists)
      # telemetry-url: { type: string, default: "" }
      # DORA-PLACEHOLDER:END
    # DORA-PLACEHOLDER:BEGIN
    # secrets:
    #   TELEMETRY_TOKEN: { required: false }
    # DORA-PLACEHOLDER:END

jobs:
  quality-and-security-gate:
    name: quality-and-security-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: gate-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # parity: P-EN-01
      - name: Validate the inputs, the event, the branch guard and the OIDC-stack guard
        uses: Nextep-xyz/nextep-platform-workflows/.github/actions/validate-inputs@main
        with:
          flow: environment-deploy
          inputs-json: ${{ toJSON(inputs) }}

  infra-deploy:
    name: infra-deploy
    needs: [quality-and-security-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # parity: P-EN-14
    concurrency:
      group: deploy-lock-${{ inputs.project }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Check out the caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # parity: P-EN-02
      - name: Set up the project
        uses: Nextep-xyz/nextep-platform-workflows/.github/actions/setup-project@main
        with:
          package-manager: ${{ inputs.package-manager }}
          pnpm-version: ${{ inputs.pnpm-version }}
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}
      - name: Assume the environment role
        uses: Nextep-xyz/nextep-platform-workflows/.github/actions/aws-oidc@main
        with:
          role-arn: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}
      # parity: P-EN-03, P-EN-04, P-EN-05, P-EN-06, P-EN-07, P-EN-08
      - name: Deploy the infrastructure
        uses: Nextep-xyz/nextep-platform-workflows/.github/actions/infra-deploy@main
        with:
          project: ${{ inputs.project }}
          environment: ${{ inputs.environment }}
          aws-region: ${{ inputs.aws-region }}
          compute: ${{ inputs.compute }}
          image-tag: ${{ inputs.image-tag }}
          prepare-command: ${{ inputs.prepare-command }}
          prepare-check-command: ${{ inputs.prepare-check-command }}
          clean-command: ${{ inputs.clean-command }}
          infra-bootstrap-command: ${{ inputs.infra-bootstrap-command }}
          infra-deploy-command: ${{ inputs.infra-deploy-command }}
          pin-image-tag-environments: ${{ inputs.pin-image-tag-environments }}
          ecr-repository: ${{ inputs.ecr-repository }}
          dockerfile: ${{ inputs.dockerfile }}
          docker-context: ${{ inputs.docker-context }}
          docker-target: ${{ inputs.docker-target }}

  database-migration:
    name: database-migration
    needs: [quality-and-security-gate, infra-deploy]
    if: ${{ inputs.image-tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-lock-${{ inputs.project }}-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Check out the caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # parity: P-EN-02
      - name: Set up the project
        uses: Nextep-xyz/nextep-platform-workflows/.github/actions/setup-project@main
        with:
          package-manager: ${{ inputs.package-manager }}
          pnpm-version: ${{ inputs.pnpm-version }}
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}
      - name: Assume the environment role
        uses: Nextep-xyz/nextep-platform-workflows/.github/actions/aws-oidc@main
        with:
          role-arn: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}
      # parity: P-EN-09
      - name: Prepare the SSM tunnel
        id: tunnel
        uses: Nextep-xyz/nextep-platform-workflows/.github/actions/ssm-tunnel@main
        with:
          project: ${{ inputs.project }}
          environment: ${{ inputs.environment }}
          aws-region: ${{ inputs.aws-region }}
          bastion-id-ssm-param: ${{ inputs.bastion-id-ssm-param }}
          db-endpoint-ssm-param: ${{ inputs.db-endpoint-ssm-param }}
      # parity: P-EN-10, P-EN-11, P-EN-12, P-EN-13
      - name: Migrate, verify and seed
        uses: Nextep-xyz/nextep-platform-workflows/.github/actions/migrate@main
        with:
          mode: environment-deploy
          project: ${{ inputs.project }}
          environment: ${{ inputs.environment }}
          aws-region: ${{ inputs.aws-region }}
          bastion-id: ${{ steps.tunnel.outputs.bastion-id }}
          db-endpoint: ${{ steps.tunnel.outputs.db-endpoint }}
          ca-bundle: ${{ steps.tunnel.outputs.ca-bundle }}
          db-secret-id: ${{ inputs.db-secret-id }}
          db-name: ${{ inputs.db-name }}
          db-schema: ${{ inputs.db-schema }}
          db-port: ${{ inputs.db-port }}
          db-ssl-mode: ${{ inputs.db-ssl-mode }}
          db-url-template: ${{ inputs.db-url-template }}
          migration-pre-command: ${{ inputs.migration-pre-command }}
          migration-command: ${{ inputs.migration-command }}
          migration-verify-command: ${{ inputs.migration-verify-command }}
          post-migrate-command: ${{ inputs.post-migrate-command }}
          migration-timeout-minutes: ${{ inputs.migration-timeout-minutes }}


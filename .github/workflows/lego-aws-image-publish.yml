# Reusable workflow: builds the image of the caller repository on the push of a version tag, pushes it to ECR as <X.Y.Z> and emits its
# digest. No database, no bastion, no deploy, no telemetry. It is the release path of a repository that DISTRIBUTES an image: the
# consumer pins the exact version and this digest.
# Contract: contracts/lego-aws-image-publish.contract.yml (gate G12). The file name and the job name are IRREVERSIBLE: the file name and
# the tag of this workflow are part of the trust policy of the publishing role (job_workflow_ref). The caller decides WHEN it runs: the
# push of a version tag (<tag-prefix>X.Y.Z) and grants: permissions: { id-token: write, contents: read }. The barrier is a tag ruleset
# plus a trust policy conditioned on job_workflow_ref and on a sub limited to the tag (docs/runbook.md section 10, docs/iam/).
# The tag is the version and the image tag is only X.Y.Z: never `latest` (gate GI-F3). If that tag already exists in ECR nothing is rebuilt
# (tags are immutable): its digest is emitted and the run is green, so a re-run after a partial failure is safe.
# No token input and no secret: the role comes from OIDC and the ECR login token is minted per run.
name: lego-aws-image-publish

on:
  workflow_call:
    inputs:
      project:
        description: "Project prefix (^[a-z][a-z0-9-]{1,15}$). Used in the concurrency group and reports."
        type: string
        required: true
      ecr-repository:
        description: "Literal name of the ECR repository to push to (it must exist, with immutable tags). No placeholders."
        type: string
        required: true
      role-arn:
        description: "Publishing role to assume through OIDC. Pass it from a repository variable, never a literal."
        type: string
        required: true
      aws-region:
        description: "AWS region."
        type: string
        default: "us-east-2"
      dockerfile:
        description: "Dockerfile path, relative to the repository root."
        type: string
        default: "Dockerfile"
      docker-context:
        description: "Docker build context, relative to the repository root."
        type: string
        default: "."
      platform:
        description: "Target platform of the image: linux/amd64 or linux/arm64 (one per run)."
        type: string
        default: "linux/amd64"
      tag-prefix:
        description: "Prefix of the version tag; the tag of the run must be <tag-prefix>X.Y.Z, for example v or engine-v."
        type: string
        default: "v"
    outputs:
      version:
        description: "The version taken from the tag (X.Y.Z)."
        value: ${{ jobs.publish.outputs.version }}
      image:
        description: "registry/repository:X.Y.Z of the published image."
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: "sha256 digest of the image, read from ECR."
        value: ${{ jobs.publish.outputs.digest }}

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    # One publication at a time per repository of images; a running one is never cancelled. A pending run replaced by a newer one is shown
    # as cancelled: re-run it.
    concurrency:
      group: image-publish-${{ inputs.project }}-${{ inputs.ecr-repository }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.digest.outputs.version }}
      image: ${{ steps.digest.outputs.image }}
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Check out the caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Everything the build reads is checked BEFORE the role is assumed: a wrong tag, a typo in the Dockerfile path or a literal role fails here.
      - name: Validate the inputs and the version tag
        id: validate
        uses: Nextep-xyz/nextep-platform-workflows/.github/actions/image-publish@c38af2ca406e8a595ad5c7ea7b5f4829cee78a6b
        with:
          command: validate
          inputs-json: ${{ toJSON(inputs) }}
      - name: Assume the publishing role
        uses: Nextep-xyz/nextep-platform-workflows/.github/actions/aws-oidc@c38af2ca406e8a595ad5c7ea7b5f4829cee78a6b
        with:
          role-arn: ${{ inputs.role-arn }}
          aws-region: ${{ inputs.aws-region }}
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      # The caller's code enters only through its Dockerfile. `docker build` does not inherit the environment of the runner.
      - name: Build and push the image
        uses: Nextep-xyz/nextep-platform-workflows/.github/actions/image-publish@c38af2ca406e8a595ad5c7ea7b5f4829cee78a6b
        with:
          command: build
          inputs-json: ${{ toJSON(inputs) }}
          version: ${{ steps.validate.outputs.version }}
          registry: ${{ steps.ecr.outputs.registry }}
      - name: Read the digest and write the summary
        id: digest
        uses: Nextep-xyz/nextep-platform-workflows/.github/actions/image-publish@c38af2ca406e8a595ad5c7ea7b5f4829cee78a6b
        with:
          command: digest
          inputs-json: ${{ toJSON(inputs) }}
          version: ${{ steps.validate.outputs.version }}
          registry: ${{ steps.ecr.outputs.registry }}

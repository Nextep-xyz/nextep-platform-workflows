# Contract of .github/workflows/lego-aws-environment-deploy.yml — machine-readable source of truth (gate G12).
# Changing a job name or an input name is a MAJOR version: it breaks required checks and callers.
workflow: lego-aws-environment-deploy
inputs:
  project:
    type: string
    required: true
  environment:
    type: string
    required: true
  compute:
    type: string
    required: true
  aws-region:
    type: string
    default: "us-east-2"
  role-arn:
    type: string
    required: true
  package-manager:
    type: string
    default: "pnpm"
  pnpm-version:
    type: string
    default: ""
  node-version:
    type: string
    default: "22"
  node-version-file:
    type: string
    default: ""
  branch-map:
    type: string
    default: ""
  bastion-id-ssm-param:
    type: string
    default: ""
  db-endpoint-ssm-param:
    type: string
    default: ""
  db-secret-id:
    type: string
    default: ""
  db-name:
    type: string
    default: ""
  db-schema:
    type: string
    default: ""
  db-port:
    type: number
    default: 5432
  db-ssl-mode:
    type: string
    default: "verify-full"
  db-url-template:
    type: string
    default: "postgresql://{user}:{password}@{host}:{port}/{db}?schema={schema}&sslmode={sslmode}"
  migration-pre-command:
    type: string
    default: ""
  migration-command:
    type: string
    default: "make migrate"
  migration-verify-command:
    type: string
    default: "make migrate-status"
  post-migrate-command:
    type: string
    default: ""
  migration-timeout-minutes:
    type: number
    default: 20
  image-tag:
    type: string
    default: ""
  prepare-command:
    type: string
    default: ""
  prepare-check-command:
    type: string
    default: ""
  clean-command:
    type: string
    default: ""
  infra-bootstrap-command:
    type: string
    default: ""
  infra-deploy-command:
    type: string
    required: true
  pin-image-tag-environments:
    type: string
    default: "stg,prod"
  ecr-repository:
    type: string
    default: ""
  dockerfile:
    type: string
    default: "Dockerfile"
  docker-context:
    type: string
    default: "."
  docker-target:
    type: string
    default: ""
  # --- P2 (lambdalith + DSQL): all optional and additive; the defaults keep the P1 behaviour -------------------------
  db-access:
    type: string
    default: "ssm-tunnel"
  install-dirs:
    type: string
    default: "."
  test-database-image:
    type: string
    default: ""
  post-deploy-command:
    type: string
    default: ""
  migrate-before-deploy:
    type: boolean
    default: false
  lint-command:
    type: string
    default: ""
  test-command:
    type: string
    default: ""
  # DORA-PLACEHOLDER:BEGIN  (inactive until the collector endpoint exists)
  # telemetry-url: { type: string, default: "" }
  # DORA-PLACEHOLDER:END
secrets: {}
# DORA-PLACEHOLDER:BEGIN
# secrets:
#   TELEMETRY_TOKEN: { required: false }
# DORA-PLACEHOLDER:END
outputs: {}
jobs:
  - quality-and-security-gate
  - infra-deploy
  - database-migration
  - post-deploy
  # DORA-PLACEHOLDER:BEGIN
  # - telemetry-phone-home
  # DORA-PLACEHOLDER:END
